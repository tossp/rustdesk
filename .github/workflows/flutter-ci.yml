name: Full Flutter CI

on:
  workflow_dispatch:
    inputs:
      custom-rendezvous:
        description: Use the custom rendezvous defaults (requires RS_PUB_KEY)
        type: boolean
        default: false
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    secrets:
      RS_PUB_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.custom-rendezvous && secrets.RS_PUB_KEY || '' }}
    with:
      custom-rendezvous: ${{ github.event_name == 'workflow_dispatch' && inputs.custom-rendezvous }}
      upload-artifact: false
