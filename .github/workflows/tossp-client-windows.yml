name: Build TossPig Windows x64 client

on:
  push:
    branches:
      - feat/tossp-client
  pull_request:
    paths:
      - .github/workflows/tossp-client-windows.yml
      - .gitmodules
      - Cargo.toml
      - build.py
      - libs/hbb_common
      - src/common.rs
      - src/updater.rs
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  smoke:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    name: Windows x64 smoke
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build TossPig smoke client
        shell: bash
        env:
          RENDEZVOUS_SERVER: rd.example.com
          # Public 32-byte all-zero test key; never a production key.
          RS_PUB_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: python3 build.py --tossp-client

  production:
    if: github.event_name == 'workflow_dispatch'
    name: Windows x64 production
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build TossPig production client
        shell: bash
        env:
          RENDEZVOUS_SERVER: rd.tossp.com
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          if [[ -z "${RS_PUB_KEY:-}" ]]; then
            echo "::error::RS_PUB_KEY secret is required"
            exit 1
          fi
          python3 build.py --tossp-client

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: tosspig-windows-x64
          path: rustdesk-*-win7-install.exe
          if-no-files-found: error
