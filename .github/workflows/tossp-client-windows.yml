name: Build TossPig Windows x64 client

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc

      - name: Build TossPig client
        shell: bash
        env:
          RENDEZVOUS_SERVER: rd.tossp.com
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          if [[ -z "${RS_PUB_KEY:-}" ]]; then
            echo "::error::RS_PUB_KEY secret is required"
            exit 1
          fi
          python3 build.py --tossp-client

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: tosspig-windows-x64
          path: rustdesk-*-win7-install.exe
          if-no-files-found: error
